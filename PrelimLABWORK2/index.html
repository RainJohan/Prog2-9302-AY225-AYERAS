<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>“Yes Sir, I Exist” System - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="beep-indicator" id="beepIndicator">🔊Wrong Password!</div>
    
    <div class="container">
        <h1>📋 “Yes Sir, I Exist” System</h1>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            
            <button type="submit">Log In</button>
        </form>

        <div id="message" class="message"></div>

        <div class="hint">
            💡 Hint: Username: <strong>student</strong> | Password: <strong>pass123</strong><br>
            <small>🔊 Try entering wrong password to hear the beep alert!</small>
        </div>

        <div id="attendanceSection" class="attendance-section">
            <h2>✅ Attendance Recorded</h2>
            <div class="attendance-info">
                <strong>User:</strong> <span id="displayUsername"></span>
            </div>
            <div class="timestamp-display">
                <div>📅 Login Timestamp</div>
                <div class="time" id="displayTimestamp"></div>
            </div>
            <button id="downloadBtn" class="download-btn">📥 Download Attendance Summary</button>
            <button id="logoutBtn" class="logout-btn">🚪 Logout</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
